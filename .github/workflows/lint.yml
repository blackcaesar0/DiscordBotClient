name: Lint
on:
  push:
    branches: 
      - electron-v3
  pull_request:
    branches:
      - electron-v3

permissions:
  contents: read

# A newer push supersedes the one in flight.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # `npm ci` installs exactly what package-lock.json pins and fails loudly when the lockfile
      # and package.json have drifted apart.
      - run: npm ci

      - run: npm run lint

      - run: npm run test:typescript

      - run: npm run test:unit
